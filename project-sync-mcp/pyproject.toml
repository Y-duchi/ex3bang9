[project]
name = "bang9-project-sync-mcp"
version = "0.1.0"
description = "MCP server for searching project records and automating WBS status reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.28.1,<2",
]

[project.scripts]
bang9-project-sync-mcp = "bang9_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bang9_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

